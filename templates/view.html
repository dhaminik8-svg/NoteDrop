
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your note — NoteDrop</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="page">
        <nav class="nav">
            <a class="brand" href="/">✳ NoteDrop</a>
            <a class="back-link" href="/">← New note</a>
        </nav>

        <section class="paper note-paper">
            <p class="eyebrow">A NOTE LEFT FOR YOU</p>
            <h1 class="note-title">A little something.</h1>

            <pre class="note-content">{{ content }}</pre>

            <div class="note-meta">
                <span>{{ views_left }} views remaining</span>
                <span>Expires {{ expires_at | datetimeformat }}</span>
            </div>

            <a class="button-link" href="/">Create your own note ↗</a>
        </section>

        <footer>Read it while it's here. <span>✳</span></footer>
    </main>
</body>
</html>
